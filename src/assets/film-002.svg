<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 750" width="100%" height="100%">
  <defs>
    <radialGradient id="stage2" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#322616" />
      <stop offset="30%" stop-color="#19140c" />
      <stop offset="70%" stop-color="#0e0d0b" />
      <stop offset="100%" stop-color="#060605" />
    </radialGradient>
    <linearGradient id="warmLight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#F1EFE8" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#C6A128" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0A0A09" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="1800" height="750" fill="url(#stage2)" />
  <rect width="1800" height="750" fill="url(#warmLight)" />

  <!-- Architectural silhouettes & warm spotlight shafts -->
  <polygon points="500,0 700,0 1100,750 400,750" fill="#C6A128" opacity="0.04" />
  <polygon points="900,0 1150,0 1450,750 800,750" fill="#F1EFE8" opacity="0.03" />

  <!-- Subtle silhouette crowd / audience horizon -->
  <ellipse cx="900" cy="800" rx="900" ry="180" fill="#050504" />
  
  <!-- RAW Film Metadata Stamp -->
  <g fill="#F1EFE8" opacity="0.32" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="3">
    <text x="70" y="70">SCENE: 14 // TAKE 03 // 2.39:1 SCOPE</text>
    <text x="70" y="690">DAR ES SALAAM ARCHIVE // EVENT REEL</text>
    <text x="1730" y="70" text-anchor="end">ANAMORPHIC T2.1</text>
    <text x="1730" y="690" text-anchor="end">4K DCI LOG3G10</text>
  </g>

  <!-- Framing Marks -->
  <line x1="70" y1="80" x2="100" y2="80" stroke="#C6A128" stroke-width="1" stroke-opacity="0.5" />
  <line x1="70" y1="80" x2="70" y2="110" stroke="#C6A128" stroke-width="1" stroke-opacity="0.5" />
  <line x1="1730" y1="80" x2="1700" y2="80" stroke="#C6A128" stroke-width="1" stroke-opacity="0.5" />
  <line x1="1730" y1="80" x2="1730" y2="110" stroke="#C6A128" stroke-width="1" stroke-opacity="0.5" />
</svg>
