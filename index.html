<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRAX.RAW · Filmmaker &amp; Visual Storyteller</title>
    <meta name="description" content="DRAX.RAW. Filmmaker, video editor, photographer and visual storyteller based in Dar es Salaam, Tanzania." />
    <meta name="theme-color" content="#ece9e2" />

    <!-- Set the colour mode before first paint — light / dark / hybrid -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('drax-theme');
          document.documentElement.dataset.mode =
            m === 'light' || m === 'dark' || m === 'hybrid' ? m : 'hybrid';
        } catch (e) {
          document.documentElement.dataset.mode = 'hybrid';
        }
      })();
    </script>

    <!-- Contemporary grotesk for the editorial system -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
